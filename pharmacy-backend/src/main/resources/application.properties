spring.application.name=pharmacy-backend
# Cổng chạy ứng dụng
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PharmacyDB;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Tự động kích hoạt profile local để seed dữ liệu mẫu khi chạy lần đầu
spring.profiles.active=local